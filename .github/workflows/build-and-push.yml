name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: webtop-vscode
            dockerfile: Dockerfile
            image_name: docker-webtop-vscode
            latest_tag: latest
            version_tag_prefix: ""
          - name: webtop-plex
            dockerfile: Dockerfile.plex-htpc
            image_name: docker-webtop-plex
            latest_tag: latest
            version_tag_prefix: ""

    env:
      IMAGE_NAME: ${{ matrix.image_name }}

    steps:
      - name: Lowercase image name
        id: repo
        run: echo "image_name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Set full image path
        id: image_path
        run: |
          echo "image_path=ghcr.io/$(echo '${{ github.actor }}' | tr '[:upper:]' '[:lower:]')/docker-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Auto-increment version tag
        id: version
        run: |
          git fetch --tags
          LATEST_TAG=$(git tag -l 'v*.*.*' --sort=-v:refname | head -n1)
          if [ -z "$LATEST_TAG" ]; then
            NEW_TAG="v0.1.0"
          else
            MAJOR=$(echo "$LATEST_TAG" | cut -d. -f1)
            MINOR=$(echo "$LATEST_TAG" | cut -d. -f2)
            PATCH=$(echo "$LATEST_TAG" | cut -d. -f3)
            NEW_PATCH=$((PATCH + 1))
            NEW_TAG="${MAJOR}.${MINOR}.${NEW_PATCH}"
          fi
          while git rev-parse "$NEW_TAG" >/dev/null 2>&1; do
            NEW_PATCH=$((NEW_PATCH + 1))
            NEW_TAG="${MAJOR}.${MINOR}.${NEW_PATCH}"
          done
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

      - name: Create and push version tag
        if: matrix.name == 'webtop-vscode'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.new_tag }}"
          git push origin "${{ steps.version.outputs.new_tag }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.image_path.outputs.image_path }}:${{ matrix.latest_tag }}
            ${{ steps.image_path.outputs.image_path }}:${{ matrix.version_tag_prefix }}${{ steps.version.outputs.new_tag }}
          labels: |
            org.opencontainers.image.title=${{ matrix.name }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.new_tag }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Create GitHub Release
        if: matrix.name == 'webtop-vscode'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.new_tag }}
          generate_release_notes: true
          body: |
            ## Docker Images

            Pull the VS Code image from GitHub Container Registry:

            ```bash
            docker pull ${{ env.REGISTRY }}/${{ steps.repo.outputs.image_name }}:${{ steps.version.outputs.new_tag }}
            ```

            Or use `latest`:

            ```bash
            docker pull ${{ env.REGISTRY }}/${{ steps.repo.outputs.image_name }}:latest
            ```

            Pull the Plex HTPC image:

            ```bash
            docker pull ghcr.io/serph91p/docker-webtop-plex:latest
            ```
